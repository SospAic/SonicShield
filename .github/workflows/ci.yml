name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Unit tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  android-build:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sonicshield-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # 模拟器集成测试（含后台保活冒烟）
  emulator-test:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r -t build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant com.sonicshield.sonic_shield android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant com.sonicshield.sonic_shield android.permission.RECORD_AUDIO || true
            adb shell dumpsys deviceidle whitelist +com.sonicshield.sonic_shield
            # BUG-045 教训：integration_test/ 必须全套纳入门禁（smoke+桥接+E2E），
            # 只跑 smoke 会让其它设备用例静默变红一整个版本无人察觉。
            flutter test integration_test/app_smoke_test.dart
            flutter test integration_test/native_bridge_test.dart
            flutter test integration_test/assist_e2e_test.dart
