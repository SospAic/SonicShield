name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：PR 有冲突时 GitHub 不会为 pull_request 生成 merge ref ⇒ 不会跑；
  # 此时可在 Actions 页或 API 手动 dispatch 本分支的 workflow。
  workflow_dispatch:

# 2026-10-10：CI 收敛为**只构建产物**（不再跑 analyze/test/coverage/emulator —— 那部分
# 由本地 `scripts/gates.sh` 门禁承担，省 Actions 计费）。本文件只负责一件事：
# 产出**可分发/可侧载的构建产物**。
#
# 2026-10-11（第八十二轮合并收口）：恢复 `android-build`（release APK）。
#  * 理由：本仓交付目标是「所有系统的 release」，Android 侧必须出**签名 APK**；
#    远程 2026-10-10 的 `1d8db2e` 把 android-build 一并裁掉了，与交付目标冲突。
#  * 保留 iOS 未签名 IPA（macOS runner 是 Windows 侧唯一能编 iOS 的环境）。
#  * analyze-test / emulator-test 仍保持在本地 gates.sh（不恢复，避免重复计费）。
jobs:
  # ---- Android：签名 release APK ----
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get

      # P1-14：正式 Release 必须用真 keystore 签名，禁止静默回退 debug 签名。
      # 从 Secrets 恢复 android/key.properties + keystore；缺失时留空，
      # 让下方 REQUIRE_RELEASE_SIGNING=1 的构建 fail-closed。
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，Release 构建将 fail-closed（P1-14）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        env:
          # 无正式 keystore 时该 flag 让 Gradle 直接失败（fail-closed），
          # 与 android/app/build.gradle.kts 的 P1-14 判据一致。
          REQUIRE_RELEASE_SIGNING: "1"
        run: flutter build apk --release

      - name: Verify APK signing certificate
        run: |
          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sonicshield-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ---- iOS：未签名 IPA（macOS runner = 无 Mac 硬件时唯一的编译环境）----
  #
  # 产物是**未签名**的 .ipa，供 Windows 侧用 Sideloadly / 爱思助手 +
  # 免费 Apple ID 重新签名后侧载到 iPhone（免费号签名 7 天有效，需每周重签）。
  # 之所以 `--no-codesign`：签名需要你的证书/描述文件，不应放进仓库 Secrets；
  # 侧载工具会用自己的 Apple ID 重签，故这里只负责"能编译出可用的 app 包"。
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          pod --version || true

      - run: flutter pub get

      # 首次构建时 Flutter 会按 ios/Runner.xcodeproj 的部署目标生成 ios/Podfile 并 pod install。
      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign

      # 手工打包成未签名 .ipa（Sideloadly/AltStore 接受未签名 IPA，自行重签）：
      # iphoneos/Runner.app → Payload/Runner.app → zip。
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/sonic_shield-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/sonic_shield-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: sonicshield-ios-ipa
          path: sonic_shield-unsigned.ipa
