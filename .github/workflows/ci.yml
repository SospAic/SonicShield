name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：PR 有冲突时 GitHub 不会为 pull_request 生成 merge ref ⇒ 不会跑；
  # 此时可在 Actions 页或 API 手动 dispatch 本分支的 workflow。
  workflow_dispatch:

# 2026-10-10：CI 收敛为**只构建未签名 iOS IPA**。
# 覆盖率 ratchet / `flutter analyze` / 宿主测试 / Android 构建 / 模拟器集成测试
# 全部裁撤，改由本地 `scripts/gates.sh` 承担。本文件只负责一件事：
# 在没有 Mac 硬件的情况下，用 macOS runner 编译出可侧载的 iOS app 包。
jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          pod --version || true

      - run: flutter pub get

      # 首次构建时 Flutter 会按 ios/Runner.xcodeproj 的部署目标生成 ios/Podfile 并 pod install。
      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign

      # 手工打包成未签名 .ipa（Sideloadly/AltStore 接受未签名 IPA，自行重签）：
      # iphoneos/Runner.app → Payload/Runner.app → zip。
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/sonic_shield-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/sonic_shield-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: sonicshield-ios-ipa
          path: sonic_shield-unsigned.ipa
