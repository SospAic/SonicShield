name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：PR 有冲突时 GitHub 不会为 pull_request 生成 merge ref ⇒ 不会跑；
  # 此时可在 Actions 页或 API 手动 dispatch 本分支的 workflow。
  workflow_dispatch:

# 2026-10-10：CI 收敛为**只构建产物**（不再跑 analyze/test/coverage/emulator —— 那部分
# 由本地 `scripts/gates.sh` 门禁承担，省 Actions 计费）。本文件只负责一件事：
# 产出**可分发/可侧载的构建产物**。
#
# 2026-10-11（第八十二轮合并收口）：恢复 `android-build`（release APK）。
#  * 理由：本仓交付目标是「所有系统的 release」，Android 侧必须出**签名 APK**；
#    远程 2026-10-10 的 `1d8db2e` 把 android-build 一并裁掉了，与交付目标冲突。
#  * 保留 iOS 未签名 IPA（macOS runner 是 Windows 侧唯一能编 iOS 的环境）。
#  * analyze-test / emulator-test 仍保持在本地 gates.sh（不恢复，避免重复计费）。
jobs:
  # ---- Android：签名 release APK ----
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get

      # P1-14：正式 Release 必须用真 keystore 签名，禁止静默回退 debug 签名。
      # 从 Secrets 恢复 android/key.properties + keystore；缺失时留空，
      # 让下方 REQUIRE_RELEASE_SIGNING=1 的构建 fail-closed。
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，Release 构建将 fail-closed（P1-14）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        env:
          # 无正式 keystore 时该 flag 让 Gradle 直接失败（fail-closed），
          # 与 android/app/build.gradle.kts 的 P1-14 判据一致。
          REQUIRE_RELEASE_SIGNING: "1"
        run: flutter build apk --release

      - name: Verify APK signing certificate
        run: |
          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sonicshield-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ---- iOS：未签名 IPA（macOS runner = 无 Mac 硬件时唯一的编译环境）----
  #
  # 产物是**未签名**的 .ipa，供 Windows 侧用 Sideloadly / 爱思助手 +
  # 免费 Apple ID 重新签名后侧载到 iPhone（免费号签名 7 天有效，需每周重签）。
  # 之所以 `--no-codesign`：签名需要你的证书/描述文件，不应放进仓库 Secrets；
  # 侧载工具会用自己的 Apple ID 重签，故这里只负责"能编译出可用的 app 包"。
  #
  # 🔴 用户基线（2026-10-12 新增）：iOS 构建**前**仓库设为公开（所有人可见）、
  # 构建**后**恢复私有。见本 job 内「Set repository public / Restore repository private」两步，
  # 以及 HANDOVER.md §8 同名长期规则。
  ios-build:
    runs-on: macos-latest
    # 2026-10-14 根因修复：仓库 default_workflow_permissions=read，而本 job 曾请求
    # `administration: write` —— 超出默认权限 ⇒ GitHub 在**创建 run 时整体拒绝**
    # （症状：push 触发全失败、jobs total_count=0、"workflow file issue"）。
    # 修复：permissions 收敛为最小集；可见性切换改用 PAT secret（见下方两步）。
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      # 🔴 用户基线：构建开始前先把仓库设为「所有人可见」（public）。
      # 需要 REPO_ADMIN_PAT（classic PAT，repo scope）；未配置则跳过并告警
      # （私有仓库跑 macOS runner 需付费 minutes，此时构建可能因配额失败）。
      - name: Set repository public (before iOS build)
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_PAT }}
        run: |
          if [ -z "$REPO_ADMIN_PAT" ]; then
            echo "::warning::未配置 REPO_ADMIN_PAT：跳过构建前公开（私有仓库 macOS minutes 需付费）"
            exit 0
          fi
          gh repo edit "$GITHUB_REPOSITORY" --visibility public

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          pod --version || true

      - run: flutter pub get

      # 2026-10-14：仓库曾缺失 ios/Podfile（Flutter create 不会自动生成，历史 CI 从未
      # 真正跑过 iOS job —— push 全被 workflow 级权限拒绝）。已补标准 Podfile
      # （platform :ios, '15.5' 与 Runner.xcodeproj 的部署目标一致）。
      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign

      # 手工打包成未签名 .ipa（Sideloadly/AltStore 接受未签名 IPA，自行重签）：
      # iphoneos/Runner.app → Payload/Runner.app → zip。
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/sonic_shield-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/sonic_shield-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: sonicshield-ios-ipa
          path: sonic_shield-unsigned.ipa

      # 🔴 用户基线：构建完成后（无论成功失败）恢复仓库为私有（private）。
      # if: always() 保证任一步失败也不会让仓库卡在公开状态。
      # 与上面同理：未配置 REPO_ADMIN_PAT 时跳过（仓库本就私有则无需恢复）。
      - name: Restore repository private (after iOS build)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_PAT }}
        run: |
          if [ -z "$REPO_ADMIN_PAT" ]; then
            echo "::warning::未配置 REPO_ADMIN_PAT：跳过构建后恢复私有"
            exit 0
          fi
          gh repo edit "$GITHUB_REPOSITORY" --visibility private
