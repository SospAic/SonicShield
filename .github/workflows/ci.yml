name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：配合「临时公开仓库 → 免费跑 CI → 构建完成即恢复私有」的既定流程
  # （账号 Actions 计费受限时的按需构建：Android 默认本机构建，iOS 走 CI）。
  # 公开仓库的 Actions 免费且不限量；构建完成后立刻改回 private。
  workflow_dispatch:
    inputs:
      run_emulator:
        description: '是否运行 emulator-test（默认否；仅要 iOS/Android 产物时可跳过）'
        type: boolean
        default: false

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Unit tests
        run: flutter test --coverage

      # 覆盖率 ratchet（P2-27）：与本地 `scripts/gates.sh` 门禁 4/4 **同判据同阈值**
      # （98.8 / 12702，由 test/gate_entrypoint_consistency_test.dart GEC-06 机器锁定）。
      # 只降不升：跌破即 exit 1 让 PR 变红，避免"全绿但覆盖分数下降"。
      - name: Coverage ratchet
        run: dart run tool/coverage_report.dart --gate=98.8 --min-covered=12702

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  android-build:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get

      # P1-14：正式 Release 必须用真 keystore 签名，禁止静默回退 debug 签名。
      # 从 Secrets 恢复 android/key.properties + keystore；缺失时留空，
      # 让下方 REQUIRE_RELEASE_SIGNING=1 的构建 fail-closed。
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，Release 构建将 fail-closed（P1-14）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        env:
          # 无正式 keystore 时该 flag 让 Gradle 直接失败（fail-closed），
          # 与 android/app/build.gradle.kts 的 P1-14 判据一致。
          REQUIRE_RELEASE_SIGNING: "1"
        run: flutter build apk --release

      - name: Verify APK signing certificate
        run: |
          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sonicshield-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # 模拟器集成测试（含后台保活冒烟）
  emulator-test:
    runs-on: ubuntu-latest
    needs: analyze-test
    # 手动 dispatch 时默认跳过（该 job 依赖托管 runner 的虚拟化栈，历史上有基建级假红；
    # 且 iOS/Android 产物不依赖它）。push/PR 仍照常运行。
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_emulator }}
    steps:
      - uses: actions/checkout@v4

      # 腾磁盘：ubuntu-latest 的 / 只有 ~14 GB 余量，而「Android Emulator + API 34
      # 系统镜像 + AVD」要数 GB，实测会在 `sdkmanager --install emulator` 处报
      # `No space left on device`，模拟器起不来 ⇒ 后续 adb 连接被拒 ⇒ 整 job 假红
      # （2026-10-05 run 37310760536 实测）。这里只删与本次构建无关的大件，
      # 不动 $AGENT_TOOLSDIRECTORY（Flutter 缓存就在那里）。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk /usr/share/swift
          sudo apt-get clean
          df -h /

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # ⚠️ 必须显式指定 profile：不指定时 avdmanager 会造出遗留的
          # **320x640 mdpi** 皮肤（2026-10-05 run 37328681568 实测
          # `androidboot.qemu.skin=320x640`），它比任何在售机型都小 ——
          # 于是「远程」页在该尺寸下误报 RenderFlex overflow 48px，
          # 而真机（Mi 14 Pro / MI MAX 2）复现不出。集成测试应跑在
          # 有代表性的机型档位上，否则测的是一个没人用的屏幕。
          profile: pixel_6
          # 2026-10-06 run 37444491481 实测：模拟器能起来、APK 也能装（streamed install
          # 2.9s），但 QEMU2 报 `detected a hanging thread 'QEMU2 main loop' /
          # 'QEMU2 CPU0/CPU1 thread'` 后 adb 变 `device offline` ⇒ 整 job 假红。
          # 这是托管 runner 的虚拟化/图形栈不稳，不是本项目代码问题（本机 API 36
          # 模拟器同一套用例 11/11 全绿）。故显式走无窗口 + 软件渲染 + 冷启动，
          # 并放宽启动超时，降低挂死概率。
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 900
          script: |
            adb install -r -t build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant com.sonicshield.sonic_shield android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant com.sonicshield.sonic_shield android.permission.RECORD_AUDIO || true
            adb shell dumpsys deviceidle whitelist +com.sonicshield.sonic_shield
            # BUG-045 教训：integration_test/ 必须全套纳入门禁（smoke+桥接+E2E），
            # 只跑 smoke 会让其它设备用例静默变红一整个版本无人察觉。
            flutter test integration_test/app_smoke_test.dart
            flutter test integration_test/native_bridge_test.dart
            flutter test integration_test/assist_e2e_test.dart

  # iOS 构建（macOS runner = 无 Mac 硬件时唯一的编译环境）。
  #
  # 产物是**未签名**的 .ipa，供 Windows 侧用 Sideloadly / 爱思助手 +
  # 免费 Apple ID 重新签名后侧载到 iPhone（免费号签名 7 天有效，需每周重签）。
  # 之所以 `--no-codesign`：签名需要你的证书/描述文件，不应放进仓库 Secrets；
  # 侧载工具会用自己的 Apple ID 重签，故这里只负责"能编译出可用的 app 包"。
  ios-build:
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          pod --version || true

      - run: flutter pub get

      # 首次构建时 Flutter 会按 ios/Runner.xcodeproj 的部署目标生成 ios/Podfile 并 pod install。
      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign

      # 手工打包成未签名 .ipa（Sideloadly/AltStore 接受未签名 IPA，自行重签）：
      # iphoneos/Runner.app → Payload/Runner.app → zip。
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/sonic_shield-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/sonic_shield-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: sonicshield-ios-ipa
          path: sonic_shield-unsigned.ipa
