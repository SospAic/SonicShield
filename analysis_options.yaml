include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_use_of_visible_for_testing_member: error
  exclude:
    - build/**
    - android/**
    - ios/**
    # ⚠️ 本地验证工作区（命令中继 / 审计报告 / 探针），已在 .gitignore 中忽略。
    #    必须排除：`flutter analyze` 扫的是**项目下所有 Dart 文件**，
    #    子 Agent 为做"隔离 diff"在此留一份 `endpoint_service.dart` 基线副本
    #    ⇒ 门禁第 1 步直接炸出 **315 条**问题（2026-09-24 实测，全部指向该副本）。
    #    这类假红会让人去追一个不存在的回归，所以在这里从结构上堵死。
    - _pt/**

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    unawaited_futures: true
    avoid_print: true
    sort_pub_dependencies: false
    # 注：不启用 require_trailing_commas——与 dart format 的输出互相冲突。
